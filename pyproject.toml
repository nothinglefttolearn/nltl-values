[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nltl-values"
dynamic = ["version"]
description = "Shared nltl static values: color tokens and named shapes."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.hatch.version]
path = "python/nltl_values/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["python/nltl_values"]

# Ship the repo's JSON inside the package, so it is the same data as Go's.
[tool.hatch.build.targets.wheel.force-include]
"tokens" = "nltl_values/data/tokens"
"shapes" = "nltl_values/data/shapes"

[tool.hatch.build.targets.sdist]
include = ["python/nltl_values", "tokens", "shapes", "README.md"]
